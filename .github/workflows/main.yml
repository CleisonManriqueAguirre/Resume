name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - site    # change if you use a different branch

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site (no Jekyll)
        run: |
          # Ensure destination exists
          mkdir -p public

          # Copy repository files into public, excluding .git and workflows
          rsync -a --exclude='.git' --exclude='.github' --exclude:'public' ./ public/

          # Remove any leftover git/CI metadata that we excluded above (safe-guard)
          rm -rf public/.git public/.github

          # Prevent GitHub Pages from running Jekyll
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
